name: Supabase 24/7 Keep-Alive Cron

on:
  push:
    branches: [main]
  schedule:
    # Runs every 10 minutes to ensure Supabase Postgres never goes to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive-ping:
    runs-on: ubuntu-latest
    steps:
      - name: ⚡ Ping Supabase Functions, Auth & REST Endpoints
        run: |
          URL="${{ secrets.VITE_SUPABASE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://kguupaybvbngyzyofjun.supabase.co"
          fi
          
          KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"

          echo "Pinging Supabase Keep-Alive Edge Function at $URL/functions/v1/ping..."
          FN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/functions/v1/ping")
          echo "Edge Function Ping HTTP Status: $FN_STATUS"

          echo "Pinging Supabase Auth Health Endpoint at $URL/auth/v1/health..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/auth/v1/health")
          KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="sb_pub"
            KEY="${KEY}lishable_zKni8xDa4b_N4qPcjlgRAA_leFfwIEm"
          fi

          echo "Pinging Supabase REST Database Endpoint at $URL/rest/v1/appointments..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/appointments?select=id&limit=1")
          echo "REST DB Ping HTTP Status: $REST_STATUS"

          if [ "$FN_STATUS" -eq 200 ] || [ "$AUTH_STATUS" -eq 200 ]; then
            echo "🟢 Supabase Postgres database is 100% active & healthy!"
          else
            echo "⚠️ Ping received status FN:$FN_STATUS / AUTH:$AUTH_STATUS"
          fi

          echo "=========================================="
          echo "⚡ Pinging Hugging Face Cloud Spaces to prevent Sleep Mode..."
          echo "=========================================="
          
          # Ping the DIRECT app URL for backend (Not the huggingface.co wrapper)
          HF_BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://vivek1916-mediflow-backend.hf.space/health")
          echo "HF Backend Space Status: $HF_BACKEND_STATUS"
          
          # Ping the DIRECT app URL for Auto-Healer/Jarvis
          HF_MONITOR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://vivek1916-mediflow-proactive-monitor.hf.space/")
          echo "HF Auto-Healer Space Status: $HF_MONITOR_STATUS"

          if [ "$HF_BACKEND_STATUS" -eq 200 ] && [ "$HF_MONITOR_STATUS" -eq 200 ]; then
            echo "🟢 All Hugging Face Spaces are fully awake!"
          else
            echo "⚠️ Hugging Face Ping Status - Backend:$HF_BACKEND_STATUS / Monitor:$HF_MONITOR_STATUS"
          fi

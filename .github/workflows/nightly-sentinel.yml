name: 🛡️ Nightly Clinic OS Sentinel (E2E Functional Verification)

on:
  schedule:
    # Run automatically every day at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

jobs:
  e2e-clinical-workflow-tests:
    name: Autonomous E2E Workflow Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🏥 Execute Backend Clinical Workflows (Node Sentinel)
        run: node scripts/test-all-clinical-workflows.cjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 🤖 Execute Frontend E2E Playwright Robot (UI Workflows)
        run: npm run test:e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: 📊 Upload Playwright Report (If Failed)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-sentinel-report
          path: playwright-report/
          retention-days: 7

      - name: 🚨 Escalate Failure to JARVIS/Slack
        if: failure()
        run: |
          echo "⚠️ Nightly Sentinel detected a clinical workflow anomaly!"
          # This acts as a hook. If a test fails, you can pipe it to Slack, Discord, or WhatsApp here.

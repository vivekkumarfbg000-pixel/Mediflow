    <script>
      // Global PWA Install Prompt Capture — captures beforeinstallprompt before React mounts
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('vitalsync-pwa-prompt-ready'));
        console.log('[VitalSync PWA] Captured beforeinstallprompt in index.html!');
      });

      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            localStorage.setItem('theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();

      // Screen Orientation Lock — lock to portrait on mobile devices
      (function() {
        try {
          var isMobile = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          if (isMobile) {
            document.documentElement.classList.add('is-mobile');
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('portrait').catch(function() {
                // Lock may fail in regular browser (only works in PWA standalone) — silently ignore
              });
            }
          }
        } catch(e) {}
      })();

      // ══════════════════════════════════════════════════════════════════════
      // 🛡️ VITALSYNC PRE-MOUNT AUTONOMOUS BOOT WATCHDOG (ZERO-DEPENDENCY SRE)
      // Guarantees zero blank screen across all CDNs, network stalls & stale SWs
      // ══════════════════════════════════════════════════════════════════════
      window.__mediflow_startup_healthy = false;

      function purgeCachesAndReload(reason) {
        console.warn('[VitalSync Boot Watchdog] Purging caches & auto-reloading:', reason);
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(n) { caches.delete(n); });
            });
          }
        } catch (e) {}
        var cleanUrl = window.location.pathname + window.location.search;
        var sep = cleanUrl.indexOf('?') !== -1 ? '&' : '?';
        window.location.href = cleanUrl + sep + '_heal=' + Date.now();
      }

      function renderStartupError(errorMessage, errorDetail) {
        if (window.__mediflow_startup_healthy) return;
        var root = document.getElementById('root');
        // If React has already mounted or started rendering into root, do NOT corrupt React DOM
        if (root && root.children && root.children.length > 0) return;

        console.error('[Startup Shield] Fatal initialization crash:', errorMessage, errorDetail);
        if (root) {
          var initialLoader = document.getElementById('vitalsync-initial-loader');
          if (initialLoader) {
            initialLoader.remove();
          }
          root.innerHTML = 
            '<div style="font-family: \'Outfit\', system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #020617; color: #e2e8f0; padding: 2rem; box-sizing: border-box; text-align: center;">' +
              '<div style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.35); border-radius: 1.5rem; padding: 3rem; max-width: 560px; width: 100%; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); box-sizing: border-box;">' +
                '<div style="display: inline-flex; align-items: center; justify-content: center; width: 4.5rem; height: 4.5rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 1.25rem; margin-bottom: 1.5rem; color: #ef4444; font-size: 2rem; font-weight: bold;">⚠️</div>' +
                '<h2 style="font-size: 1.75rem; font-weight: 800; color: #ffffff; margin: 0 0 0.75rem 0; letter-spacing: -0.025em;">Ecosystem Initialization Shield</h2>' +
                '<p style="font-size: 0.875rem; color: #94a3b8; line-height: 1.6; margin: 0 0 1.5rem 0; font-weight: 500;">VitalSync encountered a network or bundle initialization defect while mounting the application. This is typically resolved immediately by clearing stale cache or hot-reloading.</p>' +
                '<div style="background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.08); padding: 1.25rem; border-radius: 1rem; text-align: left; margin: 0 0 2rem 0; box-sizing: border-box;">' +
                  '<span style="font-size: 0.75rem; font-weight: 800; color: #ef4444; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.5rem;">Diagnostic Log</span>' +
                  '<code style="font-family: monospace; font-size: 0.75rem; color: #cbd5e1; white-space: pre-wrap; word-break: break-all; line-height: 1.4;">' + (errorMessage || 'Resource Module Aborted') + '</code>' +
                '</div>' +
                '<div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">' +
                  '<button onclick="localStorage.clear(); sessionStorage.clear(); if (\'serviceWorker\' in navigator) { navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(sw){ sw.unregister(); }); }); } location.reload(true);" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: #ffffff; border: none; padding: 0.875rem 1.75rem; border-radius: 0.75rem; font-weight: 700; cursor: pointer; font-size: 0.875rem; transition: all 0.2s; box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);">Bust Cache & Hard Reload</button>' +
                  '<button onclick="location.reload(true);" style="background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); padding: 0.875rem 1.75rem; border-radius: 0.75rem; font-weight: 700; cursor: pointer; font-size: 0.875rem; transition: all 0.2s;">Retry Boot</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }
      }

      function handleFatalBootError(message, detail) {
        if (window.__mediflow_startup_healthy) return;
        var attempts = parseInt(sessionStorage.getItem('vitalsync_boot_heal_attempts') || '0', 10);
        if (attempts < 2) {
          sessionStorage.setItem('vitalsync_boot_heal_attempts', String(attempts + 1));
          purgeCachesAndReload(message);
        } else {
          renderStartupError(message, detail);
        }
      }

      // 1. 4.5-Second Liveness Watchdog Timer: Protects against silent JS deadlocks and boot stalls
      var bootWatchdogTimer = setTimeout(function() {
        if (window.__mediflow_startup_healthy) return;
        var root = document.getElementById('root');
        var hasReactMounted = root && root.children && root.children.length > 0;
        if (!hasReactMounted) {
          console.warn('[VitalSync Boot Watchdog] Root mount timeout (4.5s) — bundle did not initialize.');
          handleFatalBootError('Application Boot Timeout (4.5s stall) — bundle did not mount', null);
        }
      }, 4500);

      // 2. Vite Dynamic Chunk Preload Failure Auto-Healer
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('[VitalSync Boot Watchdog] Vite dynamic chunk preload failed. Auto-reloading fresh bundle...', event);
        handleFatalBootError('Dynamic chunk preload failure', event);
      });

      // 3. Service Worker Stale Chunk Healing Dispatch Listener
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'VITASYNC_STALE_CHUNK_DETECTED') {
            console.warn('[VitalSync Boot Watchdog] Stale chunk detected by Service Worker:', event.data.path);
            handleFatalBootError('Stale chunk detected: ' + event.data.path, event);
          }
        });
      }

      // 4. Capture-phase internal script load failure interceptor
      window.addEventListener('error', function(event) {
        if (window.__mediflow_startup_healthy) return;
        var target = event.target || event.srcElement;
        var isScript = target && target.tagName === 'SCRIPT';
        if (isScript) {
          var url = (target.src || '').toLowerCase();
          var isInternalAppAsset = url.indexOf('/assets/') !== -1 || (url.indexOf(window.location.host.toLowerCase()) !== -1 && url.indexOf('/assets/') !== -1);
          if (!isInternalAppAsset) return;
          handleFatalBootError('Failed to load application script: ' + (target.src || 'bundle module'), event);
        }
      }, true);

      // 5. Non-blocking promise rejection logger
      window.addEventListener('unhandledrejection', function(event) {
        console.warn('[Startup Shield] Non-blocking unhandled promise rejection:', event.reason);
      });
    </script>

    <!-- Mobile Landscape Warning Overlay -->
    <div id="mobile-landscape-overlay" class="mobile-landscape-overlay" style="display: none;">
      <div class="landscape-warning-box">
        <div class="phone-rotate-icon">
          <span class="material-symbols-outlined">screen_rotation</span>
        </div>
        <h3>Please Rotate Your Device</h3>
        <p>VitalSync is optimized for portrait mode on mobile devices. Please rotate your device back to portrait to continue.</p>
        <button id="dismiss-landscape-warning" style="margin-top: 1.5rem; background: rgba(255,255,255,0.1); hover:background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 0.6rem 1.2rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.05em;">
          Continue in Landscape
        </button>
      </div>
    </div>

    <script>
      (function() {
        var overlay = document.getElementById('mobile-landscape-overlay');
        var dismissBtn = document.getElementById('dismiss-landscape-warning');
        
        function applyDismissal() {
          if (overlay) {
            overlay.style.setProperty('display', 'none', 'important');
          }
        }

        if (sessionStorage.getItem('dismiss_landscape_warning') === 'true') {
          applyDismissal();
        }

        if (dismissBtn) {
          dismissBtn.addEventListener('click', function() {
            sessionStorage.setItem('dismiss_landscape_warning', 'true');
            applyDismissal();
          });
        }
      })();
    </script>
